<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .logout-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #ff4b5c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #e63e4d;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="{{ avatar }}" class="avatar">
        <h2>Welcome {{ name }}</h2>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

</body>
</html>
